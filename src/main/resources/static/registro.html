<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Consultorio Psiquiátrico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="light-mode">
    <div class="loading" id="loading"><div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div></div>

    <div class="register-container">
        <div class="register-card">
            <h2><i class="fas fa-user-plus"></i> Registro de Paciente</h2>
            <div class="alert-info"><i class="fas fa-info-circle"></i> <strong>Importante:</strong> Tu usuario será tu correo electrónico.</div>
            <form id="registroForm">
                <input type="text" id="nombre" class="form-control" placeholder="Nombre completo" required>
                <input type="text" id="telefono" class="form-control" placeholder="Teléfono">
                <input type="email" id="correo" class="form-control" placeholder="Correo electrónico (será tu usuario)" required>
                <input type="password" id="password" class="form-control" placeholder="Contraseña (mínimo 6 caracteres)" required>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirmar contraseña" required>
                <button type="submit"><i class="fas fa-check-circle"></i> Registrarse</button>
                <button type="button" class="btn-volver" onclick="window.location.href='/'"><i class="fas fa-arrow-left"></i> Volver al Login</button>
                <div id="mensaje" class="mt-3 text-center"></div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script>
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                mostrarMensaje('❌ Las contraseñas no coinciden', 'danger');
                return;
            }
            if (password.length < 6) {
                mostrarMensaje('❌ La contraseña debe tener al menos 6 caracteres', 'danger');
                return;
            }
            
            const datos = {
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value,
                correo: document.getElementById('correo').value,
                username: document.getElementById('correo').value,
                password: password
            };
            
            setLoading(true);
            try {
                const response = await fetch('/api/public/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                const resultado = await response.text();
                if (response.ok) {
                    mostrarMensaje('✅ Registro exitoso. Redirigiendo al login...', 'success');
                    setTimeout(() => { window.location.href = '/'; }, 2000);
                } else {
                    mostrarMensaje('❌ ' + resultado, 'danger');
                }
            } catch (error) {
                mostrarMensaje('❌ Error de conexión', 'danger');
            }
            setLoading(false);
        });
    </script>
</body>
</html>
