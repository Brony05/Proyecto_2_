<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empleado - Consultorio Psiquiátrico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="light-mode">
    <div class="loading" id="loading"><div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div></div>

    <nav class="navbar navbar-custom">
        <div class="container-fluid">
            <span class="navbar-brand text-white"><i class="fas fa-user-tie"></i> Panel Empleado</span>
            <div class="d-flex align-items-center gap-2">
                <span class="text-white"><i class="fas fa-user"></i> <span id="userName"></span></span>
                <button onclick="logout()" class="btn btn-outline-light btn-sm"><i class="fas fa-sign-out-alt"></i> Salir</button>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <ul class="nav nav-tabs">
            <li class="nav-item"><button class="nav-link active" data-tab="dashboard"><i class="fas fa-chart-line"></i> Dashboard</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="clientes"><i class="fas fa-users"></i> Clientes</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="citas"><i class="fas fa-calendar-check"></i> Citas</button></li>
        </ul>

        <!-- DASHBOARD -->
        <div id="dashboard" class="tab-content">
            <div class="row">
                <div class="col-md-4">
                    <div class="stat-card">
                        <i class="fas fa-users"></i>
                        <div class="number" id="totalClientes">0</div>
                        <div class="label">Clientes</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <i class="fas fa-calendar-check"></i>
                        <div class="number" id="totalCitas">0</div>
                        <div class="label">Total Citas</div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card">
                        <i class="fas fa-calendar-day"></i>
                        <div class="number" id="citasHoy">0</div>
                        <div class="label">Citas Hoy</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CLIENTES -->
        <div id="clientes" class="tab-content" style="display:none;">
            <div class="filter-section">
                <div class="row">
                    <div class="col-md-4">
                        <button class="btn btn-primary" onclick="abrirModalCliente()"><i class="fas fa-plus"></i> Nuevo Cliente</button>
                    </div>
                    <div class="col-md-8">
                        <input type="text" id="buscarCliente" class="form-control" placeholder="Buscar cliente...">
                    </div>
                </div>
            </div>
            <div class="table-container">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Teléfono</th>
                                <th>Correo</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyClientes"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- CITAS -->
        <div id="citas" class="tab-content" style="display:none;">
            <div class="filter-section">
                <div class="row">
                    <div class="col-md-3">
                        <button class="btn btn-primary" onclick="abrirModalCita()"><i class="fas fa-plus"></i> Nueva Cita</button>
                    </div>
                    <div class="col-md-3">
                        <input type="date" id="filtroFecha" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <select id="filtroEstado" class="form-select">
                            <option value="">Todos los estados</option>
                            <option value="AGENDADA">Agendada</option>
                            <option value="EN_PROGRESO">En Progreso</option>
                            <option value="COMPLETADA">Completada</option>
                            <option value="CANCELADA">Cancelada</option>
                            <option value="REAGENDADA">Reagendada</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select id="filtroAsistencia" class="form-select">
                            <option value="">Asistencia</option>
                            <option value="PRESENTE">Presente</option>
                            <option value="AUSENTE">Ausente</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary" onclick="cargarCitas()"><i class="fas fa-search"></i> Filtrar</button>
                    </div>
                </div>
            </div>
            <div class="table-container">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Servicio</th>
                                <th>Precio</th>
                                <th>Cliente</th>
                                <th>Acompañante</th>
                                <th>Estado</th>
                                <th>Asistencia</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyCitas"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODALES -->

    <!-- Modal Cliente -->
    <div class="modal fade" id="clienteModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user"></i> Cliente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="clienteId">
                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" id="clienteNombre" class="form-control" placeholder="Nombre">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" id="clienteTelefono" class="form-control" placeholder="Teléfono">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" id="clienteCorreo" class="form-control" placeholder="Correo">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="guardarCliente()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Cita -->
    <div class="modal fade" id="citaModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-calendar-plus"></i> Nueva Cita</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">Cliente *</label>
                            <select id="citaCliente" class="form-select" required>
                                <option value="">Seleccionar cliente</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Servicio *</label>
                            <select id="citaServicio" class="form-select" required onchange="actualizarPrecio()">
                                <option value="">Seleccionar servicio</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label class="form-label">Fecha *</label>
                            <input type="date" id="citaFecha" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Hora *</label>
                            <select id="citaHora" class="form-select" required>
                                <option value="">Primero selecciona una fecha</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3 p-3 bg-light rounded">
                        <strong>💰 Precio del servicio:</strong> <span id="precioMostrado" class="precio-text">$0.00</span>
                    </div>
                    <div id="disponibilidadMsg" class="alert mt-3" style="display:none;"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="guardarCita()">Guardar Cita</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/empleado.js"></script>
</body>
</html>
