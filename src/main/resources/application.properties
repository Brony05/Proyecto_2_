spring.application.name=apiJWT

# MySQL Database
# Los secretos se leen de variables de entorno; el valor tras ':' es el fallback local (misma conducta que antes)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/consultorio_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:brony}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Email configuration - GMAIL
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:tuconsultoriopsiquiatrico@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xqnt tyom sctd baeq}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Debug email (para ver logs)
logging.level.org.springframework.mail=DEBUG


# Permitir conexiones desde cualquier dispositivo
server.address=0.0.0.0
server.port=8080


# Backup configuration
backup.directory=./backups
spring.task.scheduling.enabled=true




